version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      # This 2018 tag predates the module and lacks its current transport packages.
      - dependency-name: github.com/libp2p/go-libp2p
        versions: ['= 6.0.23+incompatible']
    groups:
      go-dependencies:
        patterns: ['*']
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, infrastructure]
    groups:
      actions:
        patterns: ['*']
