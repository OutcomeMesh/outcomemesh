name: CI infrastructure recovery

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  checks: read
  actions: write

concurrency:
  group: ci-infrastructure-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: ${{ github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3 && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Never check out the triggering PR, consume its artifacts or run its code.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Review infrastructure evidence and retry the complete current run
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci_infrastructure.py --apply
